[package]
name = "glide-core"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
getrandom = "0.4.3"
glide-git-backend = { version = "0.1.0", path = "../git-backend" }
notify = "8.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util"] }
tracing = "0.1.44"
ts-rs = "12.0.1"

[dev-dependencies]
tempfile = "3.27.0"
