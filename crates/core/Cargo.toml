[package]
name = "glide-core"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
glide-git-backend = { version = "0.1.0", path = "../git-backend" }
notify = "8.2.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
