[package]
name = "glide-bench"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "Performance benchmarks checked against the targets in docs/DESIGN.md §1.2"

[dependencies]
glide-core = { path = "../core" }
glide-git-backend = { path = "../git-backend" }
glide-log-index = { path = "../log-index" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
