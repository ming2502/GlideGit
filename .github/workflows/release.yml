name: Release

# A tag `vX.Y.Z` builds the installers and puts them on a draft GitHub
# release. Running the workflow by hand, or changing the packaging on main,
# only builds them (as artifacts), to catch packaging breakage early.
#
# macOS: a universal (Apple silicon + Intel) app and DMG. Signing and
# notarization turn on when the repository has the secrets listed in
# docs/RELEASING.md; without them the app is ad-hoc signed, which runs on the
# machine that downloads it only after the user allows it in System Settings.
#
# Windows: an NSIS installer (per user, no admin rights) and an MSI, both
# shipping MinGit as a fallback git. Signed when a code signing certificate
# is configured; otherwise SmartScreen warns on first run.
#
# Updates: with the updater key configured (variable UPDATER_PUBKEY, secrets
# TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]), the builds also make signed update
# packages, and a last job publishes `latest.json` for the in-app updater.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - crates/app/tauri.conf.json
      - crates/app/entitlements.plist
      - crates/app/tauri.windows.conf.json
      - crates/app/build.rs
      - scripts/check-version.mjs
      - scripts/fetch-mingit.mjs
      - scripts/release-config.mjs
      - scripts/updater-manifest.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME#v}"

      # Secrets are only exported when they are set: an empty
      # APPLE_CERTIFICATE would make the bundler fail instead of skipping.
      - name: Configure signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Signing with: $APPLE_SIGNING_IDENTITY"
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            if [ -n "$APPLE_API_KEY_P8" ]; then
              key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
              printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
              {
                echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
                echo "APPLE_API_KEY=$APPLE_API_KEY"
                echo "APPLE_API_KEY_PATH=$key"
                echo "NOTARIZE=1"
              } >> "$GITHUB_ENV"
              echo "Notarization: on"
            else
              echo "Notarization: off (no App Store Connect API key)"
            fi
          else
            echo "No certificate configured: ad-hoc signing, no notarization"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      # Both halves of the updater key, or neither: an app that checks for
      # updates nobody signs, or signed updates no app can verify, help no one.
      - name: Configure updater
        shell: bash
        env:
          PUBKEY: ${{ vars.UPDATER_PUBKEY }}
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$PUBKEY" ] && [ -n "$PRIVATE_KEY" ]; then
            {
              echo "GLIDEGIT_UPDATER_PUBKEY=$PUBKEY"
              echo "TAURI_SIGNING_PRIVATE_KEY=$PRIVATE_KEY"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$PRIVATE_KEY_PASSWORD"
              echo "UPDATER=1"
            } >> "$GITHUB_ENV"
            echo "Updater: on"
          elif [ -n "$PUBKEY$PRIVATE_KEY" ]; then
            echo "::warning::Only half of the updater key is configured; building without the updater"
          else
            echo "Updater: off (no key configured)"
          fi
          echo "VERSION=$(node -p 'require("./crates/app/tauri.conf.json").version')" >> "$GITHUB_ENV"

      - name: Build universal app and DMG
        run: |
          node scripts/release-config.mjs "$RUNNER_TEMP/release.json"
          pnpm tauri build --target universal-apple-darwin --bundles app,dmg --config "$RUNNER_TEMP/release.json"

      - name: Check the bundle
        run: |
          out=target/universal-apple-darwin/release/bundle
          app="$out/macos/GlideGit.app"
          lipo -archs "$app/Contents/MacOS/glidegit"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Authority|Signature|flags" || true
          if [ "${NOTARIZE:-}" = 1 ]; then
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          fi

      # The bundler notarizes and staples the app; the DMG around it is
      # notarized here so it also opens without a warning when offline.
      - name: Notarize the DMG
        if: env.NOTARIZE == '1'
        run: |
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" --wait \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"
          xcrun stapler staple "$dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: GlideGit-macos-universal
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Collect the update package
        if: env.UPDATER == '1'
        run: |
          mkdir -p "$RUNNER_TEMP/updater"
          src=target/universal-apple-darwin/release/bundle/macos/GlideGit.app.tar.gz
          cp "$src" "$RUNNER_TEMP/updater/GlideGit_${VERSION}_universal.app.tar.gz"
          cp "$src.sig" "$RUNNER_TEMP/updater/GlideGit_${VERSION}_universal.app.tar.gz.sig"
          ls -la "$RUNNER_TEMP/updater"

      - uses: actions/upload-artifact@v4
        if: env.UPDATER == '1'
        with:
          name: updater-macos
          path: ${{ runner.temp }}/updater/*

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          # Both jobs get here; whichever is second finds the release made.
          gh release create "$GITHUB_REF_NAME" --draft --title "GlideGit ${GITHUB_REF_NAME#v}" --notes "Draft: fill in the release notes before publishing." \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Fetch MinGit
        run: node scripts/fetch-mingit.mjs

      # The certificate goes into the user's store for signtool; its
      # thumbprint reaches the bundler through scripts/release-config.mjs.
      - name: Configure signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "No certificate configured: the installers are not signed"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          "SIGNED=1" >> $env:GITHUB_ENV
          Write-Output "Signing with certificate $($cert.Subject)"

      # Both halves of the updater key, or neither: an app that checks for
      # updates nobody signs, or signed updates no app can verify, help no one.
      - name: Configure updater
        shell: bash
        env:
          PUBKEY: ${{ vars.UPDATER_PUBKEY }}
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$PUBKEY" ] && [ -n "$PRIVATE_KEY" ]; then
            {
              echo "GLIDEGIT_UPDATER_PUBKEY=$PUBKEY"
              echo "TAURI_SIGNING_PRIVATE_KEY=$PRIVATE_KEY"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$PRIVATE_KEY_PASSWORD"
              echo "UPDATER=1"
            } >> "$GITHUB_ENV"
            echo "Updater: on"
          elif [ -n "$PUBKEY$PRIVATE_KEY" ]; then
            echo "::warning::Only half of the updater key is configured; building without the updater"
          else
            echo "Updater: off (no key configured)"
          fi
          echo "VERSION=$(node -p 'require("./crates/app/tauri.conf.json").version')" >> "$GITHUB_ENV"

      - name: Build installers
        shell: bash
        run: |
          node scripts/release-config.mjs "$RUNNER_TEMP/release.json"
          pnpm tauri build --bundles nsis,msi --config "$RUNNER_TEMP/release.json"

      # Install the NSIS package silently and check the result runs, with
      # the bundled git working on its own.
      - name: Check the installers
        shell: pwsh
        run: |
          $bundle = "target/release/bundle"
          $nsis = Get-ChildItem "$bundle/nsis/*-setup.exe" | Select-Object -First 1
          $msi = Get-ChildItem "$bundle/msi/*.msi" | Select-Object -First 1
          "{0}  {1:N1} MiB" -f $nsis.Name, ($nsis.Length / 1MB)
          "{0}  {1:N1} MiB" -f $msi.Name, ($msi.Length / 1MB)
          $dir = Join-Path $env:RUNNER_TEMP "GlideGit-install"
          Start-Process -FilePath $nsis.FullName -ArgumentList "/S", "/D=$dir" -Wait
          if (-not (Test-Path "$dir/glidegit.exe")) { throw "glidegit.exe was not installed" }
          & "$dir/mingit/cmd/git.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "the bundled git does not run" }
          if ($env:SIGNED -eq "1") {
            foreach ($f in @($nsis.FullName, $msi.FullName, "$dir/glidegit.exe")) {
              $sig = Get-AuthenticodeSignature $f
              "{0}: {1}" -f (Split-Path $f -Leaf), $sig.Status
              if ($sig.Status -ne "Valid") { throw "bad signature on $f" }
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: GlideGit-windows-x64
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/msi/*.msi

      # The NSIS installer doubles as the update package; the updater runs it
      # in passive mode.
      - name: Collect the update package
        if: env.UPDATER == '1'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/updater"
          cp target/release/bundle/nsis/*-setup.exe target/release/bundle/nsis/*-setup.exe.sig "$RUNNER_TEMP/updater/"
          ls -la "$RUNNER_TEMP/updater"

      - uses: actions/upload-artifact@v4
        if: env.UPDATER == '1'
        with:
          name: updater-windows
          path: ${{ runner.temp }}/updater/*

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both jobs get here; whichever is second finds the release made.
          gh release create "$GITHUB_REF_NAME" --draft --title "GlideGit ${GITHUB_REF_NAME#v}" --notes "Draft: fill in the release notes before publishing." \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" target/release/bundle/nsis/*-setup.exe target/release/bundle/msi/*.msi --clobber

  # `latest.json` for the in-app updater, on the draft release. It takes
  # effect once the release is published (the updater reads the latest
  # published release). Notes: the annotated tag's message, if any.
  updater-manifest:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v') && vars.UPDATER_PUBKEY != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          merge-multiple: true
          path: updater

      - name: Write latest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          git fetch --quiet origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:subject)%0a%0a%(contents:body)' > notes.md
          fi
          node scripts/updater-manifest.mjs "$version" updater notes.md > updater/latest.json
          cat updater/latest.json

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" updater/latest.json "updater/GlideGit_${version}_universal.app.tar.gz" --clobber
