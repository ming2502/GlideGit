name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck & build
        run: pnpm build

      - name: Frontend unit tests
        run: pnpm test

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        run: cargo test --workspace

      - name: Generated TS bindings are up to date
        shell: bash
        run: git diff --exit-code -- ui/src/bindings

  # Performance targets from docs/DESIGN.md §1.2, on a generated repository
  # (1M commits, 20k files, 800 refs). Shared runners are slower and noisier
  # than a desktop, hence the slack factor on the thresholds.
  perf:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf

      - name: Build benchmarks
        run: cargo build --release -p glide-bench

      # Generating a million commits takes minutes: keep the repository
      # until the generator changes. Saved right after generating, so a
      # failing benchmark does not throw it away.
      - id: repo-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/glidegit-bench/repo-1000000c-20000f-800r
          key: bench-repo-${{ runner.os }}-${{ hashFiles('crates/bench/src/generate.rs') }}

      - name: Generate repository
        if: steps.repo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: >
          ./target/release/glide-bench --generate-only
          --commits 1000000 --files 20000 --refs 800
          --work "${{ runner.temp }}/glidegit-bench"

      - if: steps.repo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/glidegit-bench/repo-1000000c-20000f-800r
          key: bench-repo-${{ runner.os }}-${{ hashFiles('crates/bench/src/generate.rs') }}

      - name: Run benchmarks
        shell: bash
        run: >
          ./target/release/glide-bench
          --commits 1000000 --files 20000 --refs 800
          --work "${{ runner.temp }}/glidegit-bench"
          --slack 1.5
          --json perf-${{ matrix.os }}.json
          --markdown perf-${{ matrix.os }}.md

      - name: Report
        if: always()
        shell: bash
        run: cat perf-${{ matrix.os }}.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-${{ matrix.os }}
          path: perf-${{ matrix.os }}.*
