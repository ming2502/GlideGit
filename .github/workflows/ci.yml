name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck & build
        run: pnpm build

      - name: Frontend unit tests
        run: pnpm test

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        run: cargo test --workspace

      - name: Generated TS bindings are up to date
        shell: bash
        run: git diff --exit-code -- ui/src/bindings

  # Performance targets from docs/DESIGN.md §1.2, on a generated repository
  # (1M commits, 20k files, 800 refs). Shared runners are slower and noisier
  # than a desktop, hence the slack factor on the thresholds.
  perf:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf

      - name: Build benchmarks
        run: cargo build --release -p glide-bench

      # Generating a million commits takes minutes: keep the repository
      # until the generator changes. Saved right after generating, so a
      # failing benchmark does not throw it away.
      - id: repo-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/glidegit-bench/repo-1000000c-20000f-800r
          key: bench-repo-${{ runner.os }}-${{ hashFiles('crates/bench/src/generate.rs') }}

      - name: Generate repository
        if: steps.repo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: >
          ./target/release/glide-bench --generate-only
          --commits 1000000 --files 20000 --refs 800
          --work "${{ runner.temp }}/glidegit-bench"

      - if: steps.repo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/glidegit-bench/repo-1000000c-20000f-800r
          key: bench-repo-${{ runner.os }}-${{ hashFiles('crates/bench/src/generate.rs') }}

      - name: Run benchmarks
        shell: bash
        run: >
          ./target/release/glide-bench
          --commits 1000000 --files 20000 --refs 800
          --work "${{ runner.temp }}/glidegit-bench"
          --slack 1.5
          --json perf-${{ matrix.os }}.json
          --markdown perf-${{ matrix.os }}.md

      - name: Report
        if: always()
        shell: bash
        run: cat perf-${{ matrix.os }}.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-${{ matrix.os }}
          path: perf-${{ matrix.os }}.*

  # Screenshot regression tests (e2e/, docs/TESTING.md): the UI on the mock
  # backend in each platform's engine, against baselines made on these same
  # runners. With no baselines yet for a platform, or "[update-screenshots]"
  # in the pushed commit's message, the job writes them and commits them to
  # the branch instead of comparing.
  screenshots:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            browser: webkit
            dir: darwin-webkit
          - os: windows-latest
            browser: chromium
            dir: win32-chromium
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Compare or update?
        shell: bash
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ ! -d "e2e/__screenshots__/${{ matrix.dir }}" ]; then
            echo "No baselines for ${{ matrix.dir }} yet: writing them"
            echo "MODE=update" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = push ] && printf '%s' "$MESSAGE" | grep -q '\[update-screenshots\]'; then
            echo "Asked to update the baselines"
            echo "MODE=update" >> "$GITHUB_ENV"
          else
            echo "MODE=compare" >> "$GITHUB_ENV"
          fi

      - name: Screenshot tests
        if: env.MODE == 'compare'
        run: pnpm e2e

      - name: Write baselines
        if: env.MODE == 'update'
        run: pnpm exec playwright test --update-snapshots=all

      - uses: actions/upload-artifact@v4
        if: failure() || env.MODE == 'update'
        with:
          name: screenshots-${{ matrix.dir }}
          path: |
            playwright-report/
            test-results/
            e2e/__screenshots__/${{ matrix.dir }}/

      # Only on pushes to main: a pull request's baselines come from main.
      - name: Commit baselines
        if: env.MODE == 'update' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "e2e/__screenshots__/${{ matrix.dir }}"
          if git diff --cached --quiet; then
            echo "Baselines unchanged"
            exit 0
          fi
          git commit -m "Update ${{ matrix.dir }} screenshot baselines"
          # The other platform's job may push first.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
